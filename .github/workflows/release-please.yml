on:
  push:
    branches:
      - main
name: release-please
# One run at a time: on 2026-08-19 two runs triggered ~30 s apart raced on the
# release branch ref — the loser failed with "Error updating ref" after the
# winner had already moved it. Queue instead of cancel: a queued run re-reads
# main and converges, while a cancelled one could drop a merge's release notes.
concurrency:
  group: release-please
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
